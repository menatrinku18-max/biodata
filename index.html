<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Creator - Script to Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { font-size: 24px; margin-bottom: 8px; text-align: center; color: #38bdf8; }
    p { font-size: 14px; text-align: center; color: #94a3b8; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 14px; margin-bottom: 6px; color: #cbd5e1; }
    textarea, input[type="file"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
    textarea { resize: vertical; min-height: 100px; }
    button { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    .status { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; text-align: center; font-size: 14px; }
    .status.active { display: block; background: #334155; color: #38bdf8; }
  </style>
</head>
<body>

<div class="card">
  <h1>AI Video Maker</h1>
  <p>તમારી સ્ક્રિપ્ટ અને ફોટો મૂકો અને વીડિયો બનાવો</p>

  <form id="videoForm">
    <div class="form-group">
      <label for="script">તમારી સ્ક્રિપ્ટ લખો:</label>
      <textarea id="script" placeholder="અહીં વીડિયો માટેનું લખાણ લખો..." required></textarea>
    </div>

    <div class="form-group">
      <label for="image">ફોટો પસંદ કરો:</label>
      <input type="file" id="image" accept="image/*" required>
    </div>

    <button type="submit" id="generateBtn">વીડિયો બનાવો</button>
  </form>

  <div id="statusBox" class="status">પ્રોસેસિંગ શરૂ છે... (બેકએન્ડ API કનેક્ટ કરવું જરૂરી છે)</div>
</div>

<script>
  const form = document.getElementById('videoForm');
  const statusBox = document.getElementById('statusBox');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const scriptText = document.getElementById('script').value;
    const imageFile = document.getElementById('image').files[0];

    statusBox.classList.add('active');
    statusBox.innerText = "સ્ક્રિપ્ટ અને ફોટો મળી ગયા છે! વીડિયો જનરેટ કરવા માટે AI API સાથે જોડવું પડશે.";
  });
</script>

</body>
</html>
