<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEVI COFFEE DAY - Digital Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1f0d05;
      --accent-gold: #e5b07b;
      --bg: #f9f6f0;
      --card-bg: #ffffff;
      --text-dark: #1a1a1a;
      --text-muted: #5c5249;
      --border-color: #e5d5c5;
      --veg-green: #0d8235;
      --whatsapp: #25D366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-dark); padding-bottom: 140px; }

    /* Header with Changing Backgrounds Behind Logo */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 18px 16px;
      text-align: center;
      color: #fff;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header-bg-slider {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      background: #1f0d05;
    }
    .slide-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }
    .slide-img.active {
      opacity: 1;
    }

    .header-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.8) 100%);
      z-index: 2;
    }

    .header-content {
      position: relative;
      z-index: 3;
    }

    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .lang-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .lang-btn.active {
      background: var(--accent-gold);
      color: var(--primary);
      border-color: var(--accent-gold);
    }

    .brand-logo-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: #eedcc9;
      border: 2.5px solid var(--accent-gold);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    }
    .brand-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(2.4);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    .brand-sub {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-top: 2px;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    /* Service Bar */
    .service-bar {
      max-width: 720px;
      margin: 12px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 10px;
    }
    .service-btn {
      flex: 1;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    /* Search Box */
    .search-box { padding: 12px 16px 4px; max-width: 720px; margin: auto; }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      outline: none;
      font-size: 14px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    /* Categories Navigation */
    .categories-nav {
      display: flex;
      overflow-x: auto;
      padding: 10px 16px;
      gap: 8px;
      scrollbar-width: none;
      max-width: 720px;
      margin: auto;
    }
    .categories-nav::-webkit-scrollbar { display: none; }
    .cat-btn {
      white-space: nowrap;
      padding: 8px 16px;
      background: #eae0d5;
      color: var(--primary);
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .cat-btn.active { background: var(--primary); color: #ffffff; }

    /* Menu Container */
    .menu-container { max-width: 720px; margin: auto; padding: 6px 16px; }
    .menu-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1.5px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .menu-card.disabled {
      opacity: 0.55;
      background: #f1ece7;
    }
    .item-details { flex: 1; padding-right: 12px; }
    .item-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .veg-icon {
      width: 15px;
      height: 15px;
      border: 1.5px solid var(--veg-green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .veg-icon span { width: 7px; height: 7px; background: var(--veg-green); border-radius: 50%; }
    .item-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-bestseller { background: #fff1d6; color: #8a5300; }
    .badge-special { background: #fee2e2; color: #991b1b; }

    .item-name { font-size: 15px; font-weight: 700; color: #111111; }
    .item-desc { font-size: 12px; color: var(--text-muted); line-height: 1.35; margin: 3px 0 5px; }
    .item-price { font-size: 16px; font-weight: 800; color: var(--primary); }

    /* Quantity Controls */
    .qty-controls {
      display: flex;
      align-items: center;
      background: #f7efe6;
      border-radius: 10px;
      padding: 3px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .qty-btn {
      background: #ffffff;
      color: var(--primary);
      border: 1px solid #d9c7b5;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-count { min-width: 26px; text-align: center; font-weight: 800; font-size: 14px; color: var(--primary); }
    .soldout-tag {
      font-size: 11px;
      font-weight: 800;
      color: #dc2626;
      background: #fef2f2;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #fecaca;
    }

    /* Note Input & Footer */
    .note-section { max-width: 720px; margin: 16px auto 0; padding: 0 16px; }
    .note-section input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      font-size: 13px;
      outline: none;
    }
    .social-footer {
      max-width: 720px;
      margin: 18px auto 10px;
      text-align: center;
      padding: 0 16px;
      display: flex;
      justify-content: center;
    }
    .instagram-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      padding: 7px 16px;
      border-radius: 20px;
      color: #9d2d6d;
      background: #fdf0f7;
      border: 1px solid #f8c8e3;
    }

    /* Bottom Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      padding: 10px 18px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.12);
      border-top: 1.5px solid var(--border-color);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 720px;
      margin: auto;
    }
    .cart-info {
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .cart-total-price { font-size: 18px; font-weight: 800; color: var(--primary); }
    .cart-gst-hint { font-size: 10px; color: var(--text-muted); font-weight: 700; margin-top: -2px; }
    .view-bill-btn {
      font-size: 11px;
      color: var(--primary);
      font-weight: 800;
      text-decoration: underline;
    }
    .btn-whatsapp {
      background: var(--whatsapp);
      color: #ffffff;
      border: none;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(37, 211, 102, 0.3);
    }

    /* Bill Modal (Popup) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .bill-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      border-radius: 20px 20px 0 0;
      padding: 20px 18px 24px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .bill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1.5px dashed var(--border-color);
      margin-bottom: 14px;
    }
    .bill-header h3 { font-size: 18px; color: var(--primary); font-weight: 800; }
    .btn-close {
      background: #f1ece7;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      color: var(--primary);
    }
    .bill-items-list { margin-bottom: 16px; }
    .bill-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f4ece4;
    }
    .bill-item-info { flex: 1; }
    .bill-item-name { font-size: 14px; font-weight: 700; color: #222; }
    .bill-item-price { font-size: 12px; color: var(--text-muted); }
    .bill-summary-box {
      background: #fdfaf6;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .summary-row.total-row {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      border-top: 1.5px dashed var(--border-color);
      padding-top: 8px;
      margin-top: 8px;
      margin-bottom: 0;
    }
    .btn-order-modal {
      width: 100%;
      background: var(--whatsapp);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
    }
  </style>
</head>
<body>

  <!-- Header with Changing Backgrounds & Original Big Logo -->
  <header class="header">
    <div class="header-bg-slider" id="bgSlider">
      <div class="slide-img active" style="background-image: url('banner1.jpg'), url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=800');"></div>
      <div class="slide-img" style="background-image: url('banner2.jpg'), url('https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800');"></div>
      <div class="slide-img" style="background-image: url('banner3.jpg'), url('https://images.unsplash.com/photo-1541167760496-1628856ab772?w=800');"></div>
      <div class="slide-img" style="background-image: url('banner4.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner5.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner6.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner7.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner8.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner9.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner10.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner11.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner12.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner13.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner14.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner15.jpg');"></div>
    </div>
    <div class="header-overlay"></div>

    <div class="header-content">
      <div class="lang-switcher">
        <button class="lang-btn active" id="btn-gu" onclick="setLanguage('gu')">ગુજરાતી</button>
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" id="btn-hi" onclick="setLanguage('hi')">हिन्दी</button>
      </div>

      <div class="brand-logo-wrap">
        <img src="logo.jpg" alt="DEVI COFFEE DAY" onerror="this.onerror=null; this.src='logo.png';">
      </div>
      <div class="brand-title">DEVI COFFEE DAY</div>
      <div class="brand-sub">Original Fresh</div>
    </div>
  </header>

  <!-- Service Buttons -->
  <div class="service-bar">
    <button class="service-btn" onclick="sendServiceReq('water')">💧 <span id="lblWater">પાણી મંગાવો</span></button>
    <button class="service-btn" onclick="sendServiceReq('waiter')">🛎️ <span id="lblWaiter">વેઈટર બોલાવો</span></button>
  </div>

  <!-- Search -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 મેનુમાં વાનગી શોધો..." onkeyup="renderMenu()">
  </div>

  <!-- Categories -->
  <nav class="categories-nav" id="categoryNav"></nav>

  <!-- Menu Items List -->
  <main class="menu-container" id="menuList"></main>

  <!-- Note Input -->
  <div class="note-section">
    <input type="text" id="orderNote" placeholder="✍️ કોઈ ખાસ નોંધ? (દા.ત. Less Spicy, Jain)">
  </div>

  <!-- Social Link -->
  <div class="social-footer">
    <a href="https://instagram.com/devicoffeeday" target="_blank" class="instagram-link">
      📸 Instagram: <b>@devicoffeeday</b>
    </a>
  </div>

  <!-- Bottom Cart Bar -->
  <footer class="cart-bar">
    <div class="cart-info" onclick="openBillModal()">
      <span style="font-size:11px; color:var(--text-muted); font-weight:700;" id="cartCount">0 આઇટમ્સ સિલેક્ટ કરી</span>
      <span class="cart-total-price">₹<span id="cartGrandTotal">0</span></span>
      <span class="cart-gst-hint" id="lblGstInclusive">(GST સહિત) <span class="view-bill-btn">બિલ જુઓ 📋</span></span>
    </div>
    <button class="btn-whatsapp" onclick="openBillModal()">
      <span id="lblOrderBtn">ઓર્ડર કરો</span> 🛒
    </button>
  </footer>

  <!-- Bill Modal / Popup -->
  <div class="modal-overlay" id="billModal" onclick="closeBillModal(event)">
    <div class="bill-sheet" onclick="event.stopPropagation()">
      <div class="bill-header">
        <div>
          <h3 id="lblBillTitle">🧾 તમારો ઓર્ડર (બિલ)</h3>
          <span style="font-size:12px; color:var(--text-muted); font-weight:700;" id="lblTableNum">ટેબલ નંબર: 1</span>
        </div>
        <button class="btn-close" onclick="closeBillModal()">✕</button>
      </div>

      <div class="bill-items-list" id="billItemsContainer">
        <!-- Live Selected Items Rendered Here -->
      </div>

      <!-- Bill Calculation Details -->
      <div class="bill-summary-box">
        <div class="summary-row">
          <span id="lblSubtotal">આઇટમ સબટોટલ (AMOUNT):</span>
          <span>₹<span id="billSubtotal">0</span></span>
        </div>
        <div class="summary-row">
          <span>CGST (2.5%):</span>
          <span>₹<span id="billCgst">0.00</span></span>
        </div>
        <div class="summary-row">
          <span>SGST (2.5%):</span>
          <span>₹<span id="billSgst">0.00</span></span>
        </div>
        <div class="summary-row total-row">
          <span id="lblGrandTotal">કુલ રકમ (GRAND TOTAL):</span>
          <span>₹<span id="billFinalTotal">0</span></span>
        </div>
      </div>

      <button class="btn-order-modal" onclick="sendOrderWhatsAppDirect()">
        <span id="lblSendOrderBtn">Send Order on WhatsApp</span> 📲
      </button>
    </div>
  </div>

  <script>
    // રેસ્ટોરન્ટનો WhatsApp નંબર
    const RESTAURANT_PHONE = "919898237900";
    const SHEET_ID = "1tmy2M5sRI8pNpvsgv_dwRXyIGitCTDlVUBDpQI2bjaU";

    const params = new URLSearchParams(window.location.search);
    const tableNumber = params.get('table') || params.get('Table') || params.get('t') || '1';

    let currentLang = 'gu';

    // Auto-Changing Background Logic
    const bgSlides = Array.from(document.querySelectorAll('.slide-img'));
    let currentBgIdx = 0;

    setInterval(() => {
      if (bgSlides.length <= 1) return;
      bgSlides[currentBgIdx].classList.remove('active');
      currentBgIdx = (currentBgIdx + 1) % bgSlides.length;
      bgSlides[currentBgIdx].classList.add('active');
    }, 3000);

      hi: {

        search: "🔍 मेनू में खोजें...",
        note: "✍️ कोई विशेष निर्देश? (उदा. Less Spicy, Jain)",
        cartText: "आइटम चुने गए",
        orderBtn: "ऑर्डर करें",

      { id: 98, cat: 'pasta', name: 'Rosato Pasta (Pink Sauce)', price: 309, desc: 'Pink sauce herb pasta.', isAvailable: true },
      { id: 99, cat: 'pasta', name: 'Mac-N-Cheese Pasta', price: 329, desc: 'Baked mac and cheddar cheese.', badge: 'special', isAvailable: true },

      // EXTRAS
      { id: 143, cat: 'extra', name: 'Water Bottle', price: 29, desc: 'Packaged drinking water.', isAvailable: true },
      { id: 144, cat: 'extra', name: 'Cheese Dip', price: 39, desc: 'Cheesy dip sauce.', isAvailable: true },
      { id: 145, cat: 'extra', name: 'Vanilla Ice Cream', price: 59, desc: 'Single scoop.', isAvailable: true },
      { id: 146, cat: 'extra', name: 'Chai', price: 59, desc: 'Hot fresh brewed Indian tea.', isAvailable: true },
      { id: 147, cat: 'extra', name: 'Chocolate Ice Cream', price: 79, desc: 'Single scoop.', isAvailable: true },
      { id: 148, cat: 'extra', name: 'Cookies And Cream', price: 99, desc: 'Ice cream scoop.', isAvailable: true },
      { id: 149, cat: 'extra', name: 'Cranberry Juice', price: 149, desc: 'Chilled cranberry juice.', isAvailable: true },
      { id: 150, cat: 'extra', name: 'Orange Juice', price: 149, desc: 'Chilled orange juice.', isAvailable: true },
      { id: 151, cat: 'extra', name: 'Red Bull Energy Drink', price: 179, desc: 'Red Bull can.', isAvailable: true }
    ];

    let cart = {};
    let activeCategory = 'all';

    // Live Google Sheet Sync
    async function syncWithSheet() {
      if (!SHEET_ID) return;
      try {
        const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
        const res = await fetch(gvizUrl);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows;

        rows.forEach(r => {
          const c = r.c;
          if (c && c[0] && c[4]) {
            const rowId = Number(c[0].v);
            const status = String(c[4].v).toUpperCase().trim();
            const item = menuData.find(m => m.id === rowId);
            if (item) {
              item.isAvailable = (status !== 'OFF' && status !== 'NO' && status !== '0' && status !== 'FALSE');
            }
          }
        });
        renderMenu();
      } catch (err) {
        console.log("Using local default menu status");
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + lang).classList.add('active');

      const t = UI_TRANSLATIONS[lang];
      document.getElementById('lblWater').innerText = t.water;
      document.getElementById('lblWaiter').innerText = t.waiter;
      document.getElementById('searchInput').placeholder = t.search;
      document.getElementById('orderNote').placeholder = t.note;
      document.getElementById('lblOrderBtn').innerText = t.orderBtn;
      document.getElementById('lblGstInclusive').innerHTML = t.gstInclusive;
      document.getElementById('lblBillTitle').innerText = t.billTitle;
      document.getElementById('lblTableNum').innerText = t.tableText;
      document.getElementById('lblSubtotal').innerText = t.subtotal;
      document.getElementById('lblGrandTotal').innerText = t.grandTotal;
      document.getElementById('lblSendOrderBtn').innerText = t.sendBtn;

      renderCategories();
      renderMenu();
      updateTotal();
    }

    function renderCategories() {
      const nav = document.getElementById('categoryNav');
      nav.innerHTML = '';
      categoriesList.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (activeCategory === cat.id ? ' active' : '');
        btn.innerText = cat.icon + ' ' + (cat[currentLang] || cat.en);
        btn.onclick = () => {
          activeCategory = cat.id;
          renderCategories();
          renderMenu();
        };
        nav.appendChild(btn);
      });
    }

    function renderMenu() {
      const container = document.getElementById('menuList');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      let filtered = menuData.filter(item => {
        let matchCat = (activeCategory === 'all' || item.cat === activeCategory);
        let matchSearch = item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      filtered.forEach(item => {
        let qty = cart[item.id] ? cart[item.id].qty : 0;
        let badgeHtml = '';
        if (item.badge === 'bestseller') badgeHtml = '<span class="item-badge badge-bestseller">★ Bestseller</span>';
        if (item.badge === 'special') badgeHtml = '<span class="item-badge badge-special">✦ Special</span>';

        let div = document.createElement('div');
        div.className = `menu-card ${item.isAvailable ? '' : 'disabled'}`;
        
        let actionArea = item.isAvailable ? `
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
            <span class="qty-count" id="c-${item.id}">${qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        ` : `
          <div class="soldout-tag">${UI_TRANSLATIONS[currentLang].soldOut}</div>
        `;

        div.innerHTML = `
          <div class="item-details">
            <div class="item-top">
              <div class="veg-icon"><span></span></div>
              ${badgeHtml}
              <div class="item-name">${item.name}</div>
            </div>
            <div class="item-desc">${item.desc}</div>
            <div class="item-price">₹${item.price}</div>
          </div>
          ${actionArea}
        `;
        container.appendChild(div);
      });
    }

    function updateQty(id, delta) {
      const item = menuData.find(i => i.id === id);
      if (!item || !item.isAvailable) return;

      if (!cart[id]) cart[id] = { ...item, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];

      const countEl = document.getElementById(`c-${id}`);
      if (countEl) countEl.innerText = cart[id] ? cart[id].qty : 0;

      updateTotal();
      if (document.getElementById('billModal').classList.contains('active')) {
        renderBillItems();
      }
    }

    function getCartCalculation() {
      let totalQty = 0;
      let subtotal = 0;
      for (let id in cart) {
        totalQty += cart[id].qty;
        subtotal += cart[id].qty * cart[id].price;
      }
      let cgst = subtotal * 0.025; // 2.5% CGST
      let sgst = subtotal * 0.025; // 2.5% SGST
      let grandTotal = Math.round(subtotal + cgst + sgst);

      return { totalQty, subtotal, cgst, sgst, grandTotal };
    }

    function updateTotal() {
      const calc = getCartCalculation();
      document.getElementById('cartCount').innerText = `${calc.totalQty} ${UI_TRANSLATIONS[currentLang].cartText}`;
      document.getElementById('cartGrandTotal').innerText = calc.grandTotal;

      document.getElementById('billSubtotal').innerText = calc.subtotal;
      document.getElementById('billCgst').innerText = calc.cgst.toFixed(2);
      document.getElementById('billSgst').innerText = calc.sgst.toFixed(2);
      document.getElementById('billFinalTotal').innerText = calc.grandTotal;
    }

    function openBillModal() {
      const calc = getCartCalculation();
      if (calc.totalQty === 0) {
        alert(UI_TRANSLATIONS[currentLang].alertNoItem);
        return;
      }
      renderBillItems();
      document.getElementById('billModal').classList.add('active');
    }

    function closeBillModal(e) {
      if (!e || e.target.id === 'billModal' || e.target.classList.contains('btn-close')) {
        document.getElementById('billModal').classList.remove('active');
      }
    }

    function renderBillItems() {
      const container = document.getElementById('billItemsContainer');
      container.innerHTML = '';
      let hasItems = false;

      for (let id in cart) {
        let item = cart[id];
        if (item.qty > 0) {
          hasItems = true;
          let row = document.createElement('div');
          row.className = 'bill-item-row';
          row.innerHTML = `
            <div class="bill-item-info">
              <div class="bill-item-name">${item.name}</div>
              <div class="bill-item-price">₹${item.price} × ${item.qty} = <b>₹${item.price * item.qty}</b></div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
              <span class="qty-count">${item.qty}</span>
              <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
            </div>
          `;
          container.appendChild(row);
        }
      }

      if (!hasItems) {
        container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px 0;">${UI_TRANSLATIONS[currentLang].emptyBill}</p>`;
      }
    }

    function sendServiceReq(type) {
      let serviceTitle = type === 'water' ? '💧 Water Request' : '🛎️ Call Waiter';
      let message = `🛎️ *DEVI COFFEE DAY - SERVICE REQUEST*\n` +
                    `📍 *Table Number:* ${tableNumber}\n` +
                    `📌 *Request:* ${serviceTitle}\n` +
                    `_Please attend table immediately._`;
      
      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    // Direct WhatsApp Chat Function
    function sendOrderWhatsAppDirect() {
      const calc = getCartCalculation();

      if (calc.totalQty === 0) {
        alert(UI_TRANSLATIONS[currentLang].alertNoItem);
        return;
      }

      let orderItemsText = "";
      for (let id in cart) {
        if (cart[id].qty > 0) {
          let itemCost = cart[id].qty * cart[id].price;
          orderItemsText += `• *${cart[id].name}*\n   ${cart[id].qty} × ₹${cart[id].price} = ₹${itemCost}\n`;
        }
      }

      let note = document.getElementById('orderNote').value.trim();
      let noteText = note ? `\n📝 *Special Note:* ${note}` : "";

      let message = `🍽️ *DEVI COFFEE DAY - NEW ORDER* 🍽️\n` +
                    `--------------------------------\n` +
                    `📍 *Table Number:* ${tableNumber}\n` +
                    `--------------------------------\n` +
                    `📋 *ITEMS:*\n` +
                    orderItemsText +
                    `--------------------------------\n` +
                    `💵 *AMOUNT (Subtotal):* ₹${calc.subtotal}\n` +
                    `🏛️ *CGST (2.5%):* ₹${calc.cgst.toFixed(2)}\n` +
                    `🏛️ *SGST (2.5%):* ₹${calc.sgst.toFixed(2)}\n` +
                    `--------------------------------\n` +
                    `💰 *GRAND TOTAL: ₹${calc.grandTotal}*\n` +
                    `--------------------------------` +
                    noteText + `\n\n` +
                    `_Please confirm the order._`;

      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');

      // Cart reset after placing order
      cart = {};
      document.getElementById('orderNote').value = "";
      closeBillModal();
      updateTotal();
      renderMenu();
    }

    renderCategories();
    renderMenu();
    syncWithSheet();
  </script>
</body>
</html>
