<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rinku Free AI Video Studio Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #111827;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 1px solid #1f2937;
            margin-bottom: 20px;
        }
        .header {
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            padding: 24px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 0.78rem;
            color: #f1f5f9;
            opacity: 0.9;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        textarea, select {
            width: 100%;
            padding: 12px 14px;
            background: #030712;
            border: 1px solid #374151;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            resize: none;
            transition: border-color 0.3s;
        }
        textarea:focus, select:focus {
            border-color: #4f46e5;
        }
        .quick-presets {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }
        .preset-chip {
            background: #1f2937;
            border: 1px solid #374151;
            color: #93c5fd;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .preset-chip:hover {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }
        .file-upload-box {
            border: 2px dashed #ec4899;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            background: rgba(236, 72, 153, 0.05);
            cursor: pointer;
            display: block;
            transition: background 0.3s;
        }
        .file-upload-box:hover {
            background: rgba(236, 72, 153, 0.1);
        }
        .file-upload-box input {
            display: none;
        }
        .result-section {
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }
        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #1f2937;
            border-top: 4px solid #ec4899;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .video-preview {
            width: 100%;
            height: 300px;
            background: #030712;
            border-radius: 12px;
            border: 1px solid #374151;
            overflow: hidden;
            position: relative;
        }
        .video-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: cinematicZoom 8s infinite alternate;
        }
        @keyframes cinematicZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .script-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(3, 7, 18, 0.85);
            border-top: 1px solid #4f46e5;
            padding: 10px;
            font-size: 0.78rem;
            color: #f8fafc;
            text-align: left;
            max-height: 80px;
            overflow-y: auto;
        }
        .audio-status {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 10px;
            border-radius: 10px;
            text-align: left;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .btn-download {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background: #10b981;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: background 0.2s;
        }
        .btn-download:hover {
            background: #059669;
        }
        .footer-credits {
            font-size: 0.75rem;
            color: #6b7280;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-wand-magic-sparkles"></i> Rinku AI Video Studio</h1>
            <p>ફ્રી AI વીડિયો જનરેટર (ઇમેજ અપલોડ કરો અને વીડિયો બનાવો)</p>
        </div>
        
        <div class="content">
            <label><i class="fa-solid fa-bolt"></i> ક્વિક સ્ટોરી શોર્ટકટ્સ</label>
            <div class="quick-presets">
                <div class="preset-chip" onclick="setPreset('horror')">👻 હોરર મિસ્ટ્રી</div>
                <div class="preset-chip" onclick="setPreset('love')">💖 લવ સ્ટોરી</div>
                <div class="preset-chip" onclick="setPreset('college')">🎓 કોલેજ લાઈફ</div>
            </div>

            <div class="form-group">
                <label for="prompt"><i class="fa-solid fa-pen-nib"></i> વીડિયો પ્રોમ્પ્ટ અથવા સ્ટોરી લખો</label>
                <textarea id="prompt" rows="3" placeholder="તમારી સ્ટોરી અહીં ટાઈપ કરો..."></textarea>
            </div>

            <div class="form-group">
                <label for="videoDuration"><i class="fa-solid fa-clock"></i> વીડિયોનો સમય પસંદ કરો</label>
                <select id="videoDuration">
                    <option value="15">૧૫ સેકન્ડ (Shorts / Reels)</option>
                    <option value="30" selected>૩૦ સેકન્ડ (સ્ટાન્ડર્ડ સ્ટોરી)</option>
                    <option value="60">૬૦ સેકન્ડ (ફુલ સિનેમેટિક)</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-image"></i> ફોટો અપલોડ કરો (જેવો ફોટો નાખશો કે તરત વીડિયો બનશે)</label>
                <label class="file-upload-box" for="imageInput">
                    <i class="fa-solid fa-cloud-arrow-up" style="color: #ec4899; font-size: 1.4rem; margin-bottom: 4px;"></i>
                    <span id="fileName" style="display:block; font-size:0.85rem; font-weight:600; color:#fff;">ફોટો પસંદ કરવા અહીં ટેપ કરો</span>
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="autoGenerateVideo(event)">
            </div>

            <div class="form-group">
                <label for="voiceStyle"><i class="fa-solid fa-microphone-lines"></i> અવાજ અને સાઉન્ડ ઇફેક્ટ પસંદ કરો</label>
                <select id="voiceStyle">
                    <option value="horror">👻 હોરર મિસ્ટ્રી અવાજ અને વિન્ડ ઇફેક્ટ</option>
                    <option value="love">💖 ઇમોશનલ રોમેન્ટિક અવાજ અને સોફ્ટ મ્યુઝિક</option>
                    <option value="college">🎓 યુથ કોલેજ વોઈસ અને અપબીટ મ્યુઝિક</option>
                    <option value="cinematic">🎬 ડીપ સિનેમેટિક ટ્રેલર વોઈસ</option>
                </select>
            </div>

            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p style="margin-top: 8px; font-size: 0.85rem; color: #ec4899; font-weight: 500;" id="loadingText">AI તમારા ફોટામાંથી વીડિયો બનાવી રહ્યું છે...</p>
            </div>

            <div class="result-section" id="resultSection">
                <label style="text-align: left; margin-bottom: 8px; display: block;"><i class="fa-solid fa-video"></i> તમારો AI વીડિયો તૈયાર છે</label>
                <div class="video-preview" id="videoPreview">
                    </div>
                
                <div class="audio-status" id="audioStatus">
                    <i class="fa-solid fa-volume-high"></i> <span id="voiceMsg">બેકગ્રાઉન્ડ વોઈસ સિંક થઈ ગયો છે!</span>
                    <audio id="bgAudio" preload="auto">
                        <source src="" type="audio/mp3">
                    </audio>
                </div>

                <a id="downloadBtn" class="btn-download" download="Rinku_AI_Video.mp4">
                    <i class="fa-solid fa-download"></i> AI વીડિયો ડાઉનલોડ કરો
                </a>
            </div>
        </div>
    </div>

    <div class="footer-credits">
        Designed by Rinku | Powered by Web AI Studio Pro
    </div>

    <script>
        function setPreset(type) {
            const promptBox = document.getElementById('prompt');
            const voiceSelect = document.getElementById('voiceStyle');
            
            if(type === 'horror') {
                promptBox.value = "Part 6 માં રહસ્ય ખુલશે... કોણ છે આ સાયા પાછળ? 👻\nકોમેન્ટ અને ફોલો કરો આગળની સ્ટોરી માટે!";
                voiceSelect.value = "horror";
            } else if(type === 'love') {
                promptBox.value = "સુંદર યાદો અને પ્રેમભર્યા ક્ષણોની સફર... રોમેન્ટિક સ્ટોરી 💖";
                voiceSelect.value = "love";
            } else if(type === 'college') {
                promptBox.value = "કોલેજ કેમ્પસની મસ્તી અને મિત્રો સાથેની સુંદર પળો 🎓";
                voiceSelect.value = "college";
            }
        }

        function autoGenerateVideo(event) {
            const file = event.target.files[0];
            if (!file) return;

            const promptText = document.getElementById('prompt').value.trim();
            if (!promptText) {
                alert('કૃપા કરીને ફોટો અપલોડ કરતા પહેલા ઉપર તમારો પ્રોમ્પ્ટ અથવા સ્ટોરી લખી લો!');
                event.target.value = '';
                return;
            }

            document.getElementById('fileName').innerText = "ફાઇલ સિલેક્ટ થઈ: " + file.name;
            
            const loader = document.getElementById('loader');
            const resultSection = document.getElementById('resultSection');
            const videoPreview = document.getElementById('videoPreview');
            const audioStatus = document.getElementById('audioStatus');
            const voiceMsg = document.getElementById('voiceMsg');
            const bgAudio = document.getElementById('bgAudio');
            const downloadBtn = document.getElementById('downloadBtn');
            const voiceStyle = document.getElementById('voiceStyle').value;
            const durationSec = document.getElementById('videoDuration').value;

            loader.style.display = 'flex';
            resultSection.style.display = 'block';
            videoPreview.innerHTML = '';
            audioStatus.style.display = 'none';

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;

                setTimeout(() => {
                    // Set audio effects
                    if(voiceStyle === 'horror') {
                        voiceMsg.innerText = `હોરર મિસ્ટ્રી અવાજ (${durationSec}s) અને વિન્ડ ઇફેક્ટ સક્રિય છે!`;
                        bgAudio.src = "https://actions.google.com/sounds/v1/ambiences/creepy_wind.ogg";
                    } else if(voiceStyle === 'love') {
                        voiceMsg.innerText = `રોમેન્ટિક અવાજ (${durationSec}s) અને સોફ્ટ મ્યુઝિક સક્રિય છે!`;
                        bgAudio.src = "https://actions.google.com/sounds/v1/ambiences/daytime_forest_bonfire.ogg";
                    } else if(voiceStyle === 'college') {
                        voiceMsg.innerText = `કોલેજ યુથ વોઈસઓવર (${durationSec}s) સક્રિય છે!`;
                        bgAudio.src = "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg";
                    } else {
                        voiceMsg.innerText = `સિનેમેટિક ટ્રેલર અવાજ (${durationSec}s) સક્રિય છે!`;
                        bgAudio.src = "https://actions.google.com/sounds/v1/science_fiction/scifi_laser_charge.ogg";
                    }

                    audioStatus.style.display = 'block';
                    bgAudio.play().catch(err => console.log("Audio play restriction handled"));

                    // Render video UI with image and text overlay
                    videoPreview.innerHTML = `
                        <div style="width:100%; height:100%; position:relative;">
                            <img src="${imageUrl}">
                            <div class="script-overlay">
                                <b>✨ AI જનરેટેડ સ્ટોરી:</b><br>${promptText}
                            </div>
                        </div>
                    `;

                    downloadBtn.href = imageUrl;
                    loader.style.display = 'none';
                }, 1000);
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
