<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rinku Flow AI Video Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #060913;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #10172a;
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            overflow: hidden;
            border: 1px solid #1e293b;
            margin-bottom: 20px;
        }
        .header {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            padding: 24px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 0.8rem;
            color: #f1f5f9;
            opacity: 0.9;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        textarea, select {
            width: 100%;
            padding: 12px 14px;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            resize: none;
            transition: border-color 0.3s;
        }
        textarea:focus, select:focus {
            border-color: #6366f1;
        }
        .quick-presets {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }
        .preset-chip {
            background: #1e293b;
            border: 1px solid #334155;
            color: #93c5fd;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .preset-chip:hover {
            background: #6366f1;
            color: #fff;
            border-color: #6366f1;
        }
        .file-upload-box {
            border: 2px dashed #ec4899;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            background: rgba(236, 72, 153, 0.05);
            cursor: pointer;
            display: block;
            transition: background 0.3s;
        }
        .file-upload-box:hover {
            background: rgba(236, 72, 153, 0.1);
        }
        .file-upload-box input {
            display: none;
        }
        .btn-generate {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: #fff;
            text-align: center;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: transform 0.1s;
            margin-top: 10px;
        }
        .btn-generate:active {
            transform: scale(0.98);
        }
        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }
        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #1e293b;
            border-top: 4px solid #ec4899;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .video-preview {
            width: 100%;
            height: 320px;
            background: #020617;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Flow App Style AI Camera Motion Effect */
        .video-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: flowAiMotion 10s ease-in-out infinite alternate;
        }
        @keyframes flowAiMotion {
            0% { transform: scale(1) translate(0px, 0px); filter: brightness(1); }
            50% { transform: scale(1.12) translate(-10px, -5px); filter: brightness(1.05) contrast(1.1); }
            100% { transform: scale(1.05) translate(10px, 5px); filter: brightness(0.98); }
        }
        .script-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(2, 6, 23, 0.85);
            border-top: 1px solid #6366f1;
            padding: 10px;
            font-size: 0.78rem;
            color: #f8fafc;
            text-align: left;
            max-height: 80px;
            overflow-y: auto;
        }
        .audio-status {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 10px;
            border-radius: 10px;
            text-align: left;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .btn-download {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background: #10b981;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: background 0.2s;
        }
        .btn-download:hover {
            background: #059669;
        }
        .footer-credits {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-wand-magic-sparkles"></i> Rinku Flow AI Studio</h1>
            <p>ફોટો અપલોડ કરો અને Flow App જેવો AI વીડિયો બનાવો</p>
        </div>
        
        <div class="content">
            <!-- Quick Story Presets -->
            <label><i class="fa-solid fa-bolt"></i> ક્વિક સ્ટોરી શોર્ટકટ્સ</label>
            <div class="quick-presets">
                <div class="preset-chip" onclick="setPreset('horror')">👻 હોરર મિસ્ટ્રી</div>
                <div class="preset-chip" onclick="setPreset('love')">💖 લવ સ્ટોરી</div>
                <div class="preset-chip" onclick="setPreset('college')">🎓 કોલેજ લાઈફ</div>
            </div>

            <!-- Prompt Input -->
            <div class="form-group">
                <label for="prompt"><i class="fa-solid fa-pen-nib"></i> વીડિયો પ્રોમ્પ્ટ અથવા સ્ટોરી લખો</label>
                <textarea id="prompt" rows="3" placeholder="તમારી સ્ટોરી અહીં ટાઈપ કરો...">On-screen text: "Part 6 में पता चलेगा... ये लोग कौन हैं? 👻"
CTA Voice: "Part 6 देखना है तो Follow, Comment और Share जरूर करें।"</textarea>
            </div>

            <!-- Video Duration Option -->
            <div class="form-group">
                <label for="videoDuration"><i class="fa-solid fa-clock"></i> વીડિયોનો સમય પસંદ કરો</label>
                <select id="videoDuration">
                    <option value="15">૧૫ સેકન્ડ (Shorts / Reels)</option>
                    <option value="30" selected>૩૦ સેકન્ડ (સ્ટાન્ડર્ડ સ્ટોરી)</option>
                    <option value="60">૬૦ સેકન્ડ (ફુલ સિનેમેટિક)</option>
                </select>
            </div>

            <!-- Image Upload Option -->
            <div class="form-group">
                <label><i class="fa-solid fa-image"></i> ફોટો અપલોડ કરો</label>
                <label class="file-upload-box" for="imageInput">
                    <i class="fa-solid fa-cloud-arrow-up" style="color: #ec4899; font-size: 1.4rem; margin-bottom: 4px;"></i>
                    <span id="fileName" style="display:block; font-size:0.85rem; font-weight:600; color:#fff;">ફોટો પસંદ કરવા અહીં ટેપ કરો</span>
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="handleFileSelect(event)">
            </div>

            <!-- Voice & Sound Style Selection -->
            <div class="form-group">
                <label for="voiceStyle"><i class="fa-solid fa-microphone-lines"></i> અવાજ અને સાઉન્ડ ઇફેક્ટ પસંદ કરો</label>
                <select id="voiceStyle">
                    <option value="horror">👻 હોરર મિસ્ટ્રી અવાજ અને વિન્ડ ઇફેક્ટ</option>
                    <option value="love">💖 ઇમોશનલ રોમેન્ટિક અવાજ અને સોફ્ટ મ્યુઝિક</option>
                    <option value="college">🎓 યુથ કોલેજ વોઈસ અને અપબીટ મ્યુઝિક</option>
                    <option value="cinematic">🎬 ડીપ સિનેમેટિક ટ્રેલર વોઈસ</option>
                </select>
            </div>

            <!-- Generate Button -->
            <button class="btn-generate" onclick="generateFlowVideo()"><i class="fa-solid fa-play"></i> Generate Flow AI Video</button>

            <!-- Loader -->
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p style="margin-top: 8px; font-size: 0.85rem; color: #ec4899; font-weight: 500;" id="loadingText">AI કેમેરા મોશન અને ઇફેક્ટ્સ સેટ કરી રહ્યું છે...</p>
            </div>

            <!-- Result Section -->
            <div class="result-section" id="resultSection" style="display: none;">
                <label style="text-align: left; margin-bottom: 8px; display: block;"><i class="fa-solid fa-video"></i> તમારો Flow AI વીડિયો તૈયાર છે</label>
                <div class="video-preview" id="videoPreview">
                    <!-- Dynamic Flow AI Motion Output -->
                </div>
                
                <div class="audio-status" id="audioStatus">
                    <i class="fa-solid fa-volume-high"></i> <span id="audioText">AI સાઉન્ડ અને કેમેરા મોશન સિંક થઈ ગયા છે!</span>
                </div>

                <!-- Download Button -->
                <a id="downloadBtn" class="btn-download" href="#" download="Rinku_Flow_AI_Video.mp4">
                    <i class="fa-solid fa-download"></i> AI વીડિયો ડાઉનલોડ કરો
                </a>
            </div>
        </div>
    </div>

    <div class="footer-credits">
        Designed by Rinku | Powered by Web AI Studio Pro
    </div>

    <script>
        let selectedImageUrl = "";

        function setPreset(type) {
            const promptBox = document.getElementById('prompt');
            const voiceSelect = document.getElementById('voiceStyle');
            
            if(type === 'horror') {
                promptBox.value = "On-screen text: \"Part 6 में पता चलेगा... ये लोग कौन हैं? 👻\"\nCTA Voice: \"Part 6 देखना है तो Follow, Comment और Share जरूर करें।\"";
                voiceSelect.value = "horror";
            } else if(type === 'love') {
                promptBox.value = "સુંદર યાદો અને પ્રેમભર્યા ક્ષણોની સફર... રોમેન્ટિક સ્ટોરી 💖";
                voiceSelect.value = "love";
            } else if(type === 'college') {
                promptBox.value = "કોલેજ કેમ્પસની મસ્તી અને મિત્રો સાથેની સુંદર પળો 🎓";
                voiceSelect.value = "college";
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileName').innerText = "સિલેક્ટ થયેલ ફોટો: " + file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageUrl = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function generateFlowVideo() {
            const promptText = document.getElementById('prompt').value.trim();
            if (!promptText) {
                alert('કૃપા કરીને પહેલા પ્રોમ્પ્ટ અથવા સ્ટોરી લખો!');
                return;
            }
            if (!selectedImageUrl) {
                alert('કૃપા કરીને પહેલા ફોટો અપલોડ કરો!');
                return;
            }

            const loader = document.getElementById('loader');
            const resultSection = document.getElementById('resultSection');
            const videoPreview = document.getElementById('videoPreview');
            const audioStatus = document.getElementById('audioStatus');
            const downloadBtn = document.getElementById('downloadBtn');
            const voiceStyle = document.getElementById('voiceStyle').value;
            const durationSec = document.getElementById('videoDuration').value;

            loader.style.display = 'flex';
            resultSection.style.display = 'block';
            videoPreview.innerHTML = '';
            audioStatus.style.display = 'none';

            setTimeout(() => {
                if(voiceStyle === 'horror') {
                    document.getElementById('audioText').innerText = `Spooky Horror narration (${durationSec}s) & camera motion active!`;
                } else if(voiceStyle === 'love') {
                    document.getElementById('audioText').innerText = `Romantic voice & smooth cinematic zoom active (${durationSec}s)!`;
                } else {
                    document.getElementById('audioText').innerText = `Cinematic voiceover & motion effects active (${durationSec}s)!`;
                }
                audioStatus.style.display = 'block';

                // Render Flow App Style Moving Video Preview using user's uploaded photo
                videoPreview.innerHTML = `
                    <img src="${selectedImageUrl}" alt="AI Video Frame">
                    <div class="script-overlay">
                        <b>✨ Flow AI Script:</b><br>${promptText}
                    </div>
                `;

                downloadBtn.href = selectedImageUrl;
                loader.style.display = 'none';
            }, 1200);
        }
    </script>
</body>
</html>
