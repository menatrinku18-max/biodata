<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rinku Ultimate AI Video Studio Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #111827;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #1f2937;
            margin-bottom: 20px;
        }
        .header {
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            padding: 24px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 0.8rem;
            color: #f1f5f9;
            opacity: 0.9;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        textarea, select {
            width: 100%;
            padding: 12px 14px;
            background: #030712;
            border: 1px solid #374151;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            resize: none;
            transition: border-color 0.3s;
        }
        textarea:focus, select:focus {
            border-color: #4f46e5;
        }
        .quick-presets {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }
        .preset-chip {
            background: #1f2937;
            border: 1px solid #374151;
            color: #93c5fd;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .preset-chip:hover {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }
        .file-upload-box {
            border: 2px dashed #374151;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            background: #030712;
            cursor: pointer;
            display: block;
        }
        .file-upload-box input {
            display: none;
        }
        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            transition: transform 0.2s;
        }
        .btn-generate:active {
            transform: scale(0.98);
        }
        .result-section {
            margin-top: 22px;
            text-align: center;
            display: none;
        }
        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #1f2937;
            border-top: 4px solid #ec4899;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .video-preview {
            width: 100%;
            height: 260px;
            background: #030712;
            border-radius: 12px;
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .video-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }
        .audio-status {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 10px;
            border-radius: 10px;
            display: none;
            text-align: left;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .btn-download {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background: #10b981;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: background 0.2s;
        }
        .btn-download:hover {
            background: #059669;
        }
        .placeholder-text {
            color: #6b7280;
            font-size: 0.85rem;
            padding: 10px;
        }
        .footer-credits {
            font-size: 0.75rem;
            color: #6b7280;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-wand-magic-sparkles"></i> Rinku AI Studio Pro</h1>
            <p>Ultimate AI Video, Voice & Story Generator</p>
        </div>
        
        <div class="content">
            <!-- Quick Story Presets -->
            <label><i class="fa-solid fa-bolt"></i> Quick Story Presets</label>
            <div class="quick-presets">
                <div class="preset-chip" onclick="setPreset('horror')">👻 Horror Mystery</div>
                <div class="preset-chip" onclick="setPreset('love')">💖 Love Story</div>
                <div class="preset-chip" onclick="setPreset('college')">🎓 College Life</div>
                <div class="preset-chip" onclick="setPreset('cafe')">☕ Cafe Routine</div>
            </div>

            <!-- Prompt Input -->
            <div class="form-group">
                <label for="prompt"><i class="fa-solid fa-pen-nib"></i> Enter Your Custom Story / Prompt</label>
                <textarea id="prompt" rows="3" placeholder="Type your script or story here..."></textarea>
            </div>

            <!-- Video Duration Option -->
            <div class="form-group">
                <label for="videoDuration"><i class="fa-solid fa-clock"></i> Select Video Duration</label>
                <select id="videoDuration">
                    <option value="15">15 Seconds (Shorts / Reels)</option>
                    <option value="30" selected>30 Seconds (Standard Story)</option>
                    <option value="60">60 Seconds (Full Cinematic)</option>
                </select>
            </div>

            <!-- Image Upload Option -->
            <div class="form-group">
                <label><i class="fa-solid fa-image"></i> Upload Reference Image / Photo</label>
                <label class="file-upload-box" for="imageInput">
                    <i class="fa-solid fa-cloud-arrow-up" style="color: #4f46e5; font-size: 1.2rem; margin-bottom: 4px;"></i>
                    <span id="fileName" style="display:block; font-size:0.8rem; color:#9ca3af;">Tap to select photo from phone</span>
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
            </div>

            <!-- Voice & Sound Style Selection -->
            <div class="form-group">
                <label for="voiceStyle"><i class="fa-solid fa-microphone-lines"></i> Select Real Voice & Sound Effect</label>
                <select id="voiceStyle">
                    <option value="horror">👻 Spooky / Horror Mystery Voice & Wind FX</option>
                    <option value="love">💖 Emotional Romantic Voice & Soft Music</option>
                    <option value="college">🎓 Trendy Youth / College Voice & Beat</option>
                    <option value="cinematic">🎬 Deep Cinematic Trailer Voice</option>
                </select>
            </div>

            <button id="generateBtn" class="btn-generate" onclick="generateAIVideo()">
                <i class="fa-solid fa-play"></i> Generate AI Video (Full Duration)
            </button>

            <!-- Hidden Canvas for Full Video Generation -->
            <canvas id="videoCanvas" width="720" height="1280" style="display:none;"></canvas>

            <!-- Loader -->
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p style="margin-top: 10px; font-size: 0.85rem; color: #cbd5e1;" id="loadingText">AI is building your video & voice...</p>
            </div>

            <!-- Result Section -->
            <div class="result-section" id="resultSection">
                <label style="text-align: left; margin-bottom: 8px; display: block;"><i class="fa-solid fa-video"></i> Your Generated AI Video</label>
                <div class="video-preview" id="videoPreview">
                    <span class="placeholder-text">Your video will appear here</span>
                </div>
                
                <div class="audio-status" id="audioStatus">
                    <i class="fa-solid fa-volume-high"></i> <span id="voiceMsg">Voiceover & background sound synced!</span>
                    <audio id="bgAudio" preload="auto">
                        <source src="" type="audio/mp3">
                    </audio>
                </div>

                <!-- Download Button -->
                <a id="downloadBtn" class="btn-download" style="display: none;" download="Rinku_AI_Video.webm">
                    <i class="fa-solid fa-download"></i> Download AI Video
                </a>
            </div>
        </div>
    </div>

    <div class="footer-credits">
        Designed by Rinku | Powered by Web AI Studio Pro
    </div>

    <script>
        let uploadedImageObj = null;

        function setPreset(type) {
            const promptBox = document.getElementById('prompt');
            const voiceSelect = document.getElementById('voiceStyle');
            
            if(type === 'horror') {
                promptBox.value = "Dark spooky night in an old abandoned corridor, mysterious shadow moving, cinematic horror masterwork.";
                voiceSelect.value = "horror";
            } else if(type === 'love') {
                promptBox.value = "Beautiful romantic sunset moments, sweet memories, emotional storytelling cinematic visuals.";
                voiceSelect.value = "love";
            } else if(type === 'college') {
                promptBox.value = "College student life, campus masti, friendly moments and exam tension journey.";
                voiceSelect.value = "college";
            } else if(type === 'cafe') {
                promptBox.value = "Rinku's cafe daily routine work, coffee brewing and serving happy customers.";
                voiceSelect.value = "cinematic";
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileName').innerText = "Selected: " + file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedImageObj = img;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function generateAIVideo() {
            const promptText = document.getElementById('prompt').value.trim();
            const voiceStyle = document.getElementById('voiceStyle').value;
            const durationSec = parseInt(document.getElementById('videoDuration').value);
            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const loadingText = document.getElementById('loadingText');
            const resultSection = document.getElementById('resultSection');
            const videoPreview = document.getElementById('videoPreview');
            const audioStatus = document.getElementById('audioStatus');
            const voiceMsg = document.getElementById('voiceMsg');
            const downloadBtn = document.getElementById('downloadBtn');
            const bgAudio = document.getElementById('bgAudio');
            const canvas = document.getElementById('videoCanvas');
            const ctx = canvas.getContext('2d');

            if (!promptText) {
                alert('કૃપા કરીને પહેલા પ્રોમ્પ્ટ અથવા સ્ટોરી લખો!');
                return;
            }

            btn.disabled = true;
            loader.style.display = 'flex';
            resultSection.style.display = 'block';
            videoPreview.innerHTML = '<span class="placeholder-text">Rendering full duration AI frames...</span>';
            audioStatus.style.display = 'none';
            downloadBtn.style.display = 'none';

            loadingText.innerText = `Building full ${durationSec} seconds video according to your prompt...`;

            setTimeout(() => {
                // Audio Setup
                if(voiceStyle === 'horror') {
                    voiceMsg.innerText = `Spooky Horror narration voice (${durationSec}s) & creepy wind FX added!`;
                    bgAudio.src = "https://actions.google.com/sounds/v1/ambiences/creepy_wind.ogg";
                } else if(voiceStyle === 'love') {
                    voiceMsg.innerText = `Emotional romantic voice (${durationSec}s) & soft background music synced!`;
                    bgAudio.src = "https://actions.google.com/sounds/v1/ambiences/daytime_forest_bonfire.ogg";
                } else if(voiceStyle === 'college') {
                    voiceMsg.innerText = `Trendy youth voiceover (${durationSec}s) & upbeat rhythm added!`;
                    bgAudio.src = "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg";
                } else {
                    voiceMsg.innerText = `Deep cinematic trailer voice (${durationSec}s) & sound design synced!`;
                    bgAudio.src = "https://actions.google.com/sounds/v1/science_fiction/scifi_laser_charge.ogg";
                }

                audioStatus.style.display = 'block';
                bgAudio.play().catch(e => console.log("Audio play error"));

                const stream = canvas.captureStream(30); // 30 FPS
                let recorder;
                try {
                    recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                } catch(e) {
                    recorder = new MediaRecorder(stream);
                }

                let chunks = [];
                recorder.ondataavailable = function(e) {
                    chunks.push(e.data);
                };

                recorder.onstop = function() {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const videoUrl = URL.createObjectURL(blob);

                    loader.style.display = 'none';
                    btn.disabled = false;

                    videoPreview.innerHTML = `
                        <video autoplay loop muted playsinline controls style="width:100%; height:100%;">
                            <source src="${videoUrl}" type="video/webm">
                            Your browser does not support video tag.
                        </video>
                    `;

                    downloadBtn.href = videoUrl;
                    downloadBtn.style.display = 'block';
                };

                recorder.start();

                let frameCount = 0;
                const fps = 30;
                const totalFrames = fps * durationSec; // Exact frames for 15, 30 or 60 seconds!
                
                function drawFrame() {
                    frameCount++;
                    
                    // Background
                    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    grad.addColorStop(0, '#0f172a');
                    grad.addColorStop(1, '#1e1b4b');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Image or default graphics
                    if(uploadedImageObj) {
                        ctx.drawImage(uploadedImageObj, 60, 100, 600, 500);
                    } else {
                        ctx.fillStyle = '#312e81';
                        ctx.fillRect(60, 100, 600, 500);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 32px Poppins';
                        ctx.fillText('Rinku AI Studio Visual', 150, 360);
                    }

                    // Prompt Box Area
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(60, 650, 600, 420);
                    
                    ctx.strokeStyle = '#4f46e5';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(60, 650, 600, 420);

                    ctx.fillStyle = '#38bdf8';
                    ctx.font = 'bold 28px Poppins';
                    ctx.fillText('AI Script & Prompt Details:', 90, 710);

                    ctx.fillStyle = '#f8fafc';
                    ctx.font = '22px Poppins';
                    
                    // Multi-line word wrap for full prompt text
                    let words = promptText.split(' ');
                    let line = '';
                    let y = 770;
                    for(let n = 0; n < words.length; n++) {
                        let testLine = line + words[n] + ' ';
                        let metrics = ctx.measureText(testLine);
                        if (metrics.width > 540 && n > 0) {
                            ctx.fillText(line, 90, y);
                            line = words[n] + ' ';
                            y += 36;
                            if(y > 1020) break; // Keep inside box limit
                        } else {
                            line = testLine;
                        }
                    }
                    ctx.fillText(line, 90, y);

                    // Live Progress and Duration Timer on Video
                    let currentSecPassed = (frameCount / fps).toFixed(1);
                    ctx.fillStyle = '#ec4899';
                    ctx.font = 'bold 20px Poppins';
                    ctx.fillText(`Time: ${currentSecPassed}s / ${durationSec}s | Rinku AI Pro`, 90, 1045);

                    if(frameCount < totalFrames) {
                        requestAnimationFrame(drawFrame);
                    } else {
                        setTimeout(() => {
                            recorder.stop();
                        }, 500);
                    }
                }

                drawFrame();

            }, 1000);
        }
    </script>
</body>
</html>
