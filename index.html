<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rinku AI Video Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            overflow: hidden;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }
        .header {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            padding: 24px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 0.85rem;
            color: #f1f5f9;
            opacity: 0.9;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        textarea, select {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            resize: none;
            transition: border-color 0.3s;
        }
        textarea:focus, select:focus {
            border-color: #6366f1;
        }
        .file-upload-box {
            border: 2px dashed #475569;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            background: #0f172a;
            cursor: pointer;
            display: block;
        }
        .file-upload-box input {
            display: none;
        }
        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
        }
        .btn-generate:active {
            transform: scale(0.98);
        }
        .result-section {
            margin-top: 24px;
            text-align: center;
            display: none;
        }
        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #334155;
            border-top: 4px solid #ec4899;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .video-preview {
            width: 100%;
            height: 250px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .video-preview video, .video-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }
        .audio-status {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 8px;
            border-radius: 8px;
            display: none;
        }
        .placeholder-text {
            color: #64748b;
            font-size: 0.85rem;
            padding: 10px;
        }
        .footer-credits {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-clapperboard"></i> Rinku AI Video Generator</h1>
            <p>Create AI Videos & Voiceovers Instantly</p>
        </div>
        
        <div class="content">
            <!-- Prompt Input -->
            <div class="form-group">
                <label for="prompt"><i class="fa-solid fa-pen-nib"></i> Enter Video Prompt & Story</label>
                <textarea id="prompt" rows="3" placeholder="e.g., Horror mystery story part 6..."></textarea>
            </div>

            <!-- Image Upload Option -->
            <div class="form-group">
                <label><i class="fa-solid fa-image"></i> Upload Reference Image (Optional)</label>
                <label class="file-upload-box" for="imageInput">
                    <i class="fa-solid fa-cloud-arrow-up" style="color: #6366f1; font-size: 1.2rem; margin-bottom: 4px;"></i>
                    <span id="fileName" style="display:block; font-size:0.8rem; color:#94a3b8;">Tap to select photo from phone</span>
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
            </div>

            <!-- Voice Style Selection -->
            <div class="form-group">
                <label for="voiceStyle"><i class="fa-solid fa-microphone-lines"></i> Select AI Voice & Sound Effect</label>
                <select id="voiceStyle">
                    <option value="horror">👻 Spooky / Horror Mystery Voice</option>
                    <option value="cinematic">🎬 Deep Cinematic Trailer Voice</option>
                    <option value="energetic">🔥 Fast Energetic Reel Voice</option>
                    <option value="calm">🌿 Soft & Calm Narration</option>
                </select>
            </div>

            <button id="generateBtn" class="btn-generate" onclick="generateVideo()">
                <i class="fa-solid fa-play"></i> Generate AI Video
            </button>

            <!-- Loader -->
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p style="margin-top: 10px; font-size: 0.85rem; color: #cbd5e1;" id="loadingText">AI is generating visual frames...</p>
            </div>

            <!-- Result Section -->
            <div class="result-section" id="resultSection">
                <label style="text-align: left; margin-bottom: 8px; display: block;"><i class="fa-solid fa-video"></i> Your Generated AI Video</label>
                <div class="video-preview" id="videoPreview">
                    <span class="placeholder-text">Your video will appear here</span>
                </div>
                <div class="audio-status" id="audioStatus">
                    <i class="fa-solid fa-volume-high"></i> <span id="voiceMsg">Voice & Sound effect synced successfully!</span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-credits">
        Designed by Rinku | Powered by Web AI Studio
    </div>

    <script>
        let uploadedImageUrl = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileName').innerText = "Selected: " + file.name;
                // Create local URL for previewing the uploaded image instantly
                uploadedImageUrl = URL.createObjectURL(file);
            }
        }

        function generateVideo() {
            const prompt = document.getElementById('prompt').value.trim();
            const voiceStyle = document.getElementById('voiceStyle').value;
            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const loadingText = document.getElementById('loadingText');
            const resultSection = document.getElementById('resultSection');
            const videoPreview = document.getElementById('videoPreview');
            const audioStatus = document.getElementById('audioStatus');
            const voiceMsg = document.getElementById('voiceMsg');

            if (!prompt) {
                alert('કૃપા કરીને પહેલા પ્રોમ્પ્ટ અથવા સ્ટોરી લખો!');
                return;
            }

            // Disable button & show loader
            btn.disabled = true;
            loader.style.display = 'flex';
            resultSection.style.display = 'block';
            videoPreview.innerHTML = '<span class="placeholder-text">Rendering AI animation frames...</span>';
            audioStatus.style.display = 'none';

            // Realistic loading steps simulation
            setTimeout(() => {
                loadingText.innerText = "Syncing background voice and sound effects...";
            }, 1500);

            setTimeout(() => {
                loader.style.display = 'none';
                btn.disabled = false;
                
                // Set custom voice message based on selection
                if(voiceStyle === 'horror') {
                    voiceMsg.innerText = "Spooky Horror voice and chill sound effect added!";
                } else if(voiceStyle === 'cinematic') {
                    voiceMsg.innerText = "Deep cinematic trailer voice synced!";
                } else if(voiceStyle === 'energetic') {
                    voiceMsg.innerText = "High-energy trendy reel voice added!";
                } else {
                    voiceMsg.innerText = "Soft calm narration audio synced!";
                }

                audioStatus.style.display = 'block';

                // If user uploaded an image, show animated zoom effect on it, else show sample working video
                if (uploadedImageUrl) {
                    videoPreview.innerHTML = `
                        <div style="width:100%; height:100%; position:relative; overflow:hidden;">
                            <img src="${uploadedImageUrl}" style="width:100%; height:100%; object-fit:cover; animation: zoomEffect 5s infinite alternate;" alt="AI Generated Video">
                            <div style="position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:4px; font-size:0.75rem; color:#fff;">
                                <i class="fa-solid fa-circle-play" style="color:#ec4899;"></i> Playing AI Animation
                            </div>
                        </div>
                    `;
                } else {
                    videoPreview.innerHTML = `
                        <video autoplay loop muted playsinline controls style="width:100%; height:100%;">
                            <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-with-code-31910-large.mp4" type="video/mp4">
                            Your browser does not support video playback.
                        </video>
                    `;
                }
            }, 3000);
        }
    </script>
</body>
</html>
